<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Скотч — бесконечная доска заметок</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='22' rx='3' fill='%23ffe08a'/%3E%3Crect x='8' y='1' width='16' height='7' rx='1.5' fill='%23ffffff' opacity='.65' transform='rotate(-4 16 5)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2ecdf;
    --panel:#faf6ec;
    --panel2:#fffdf6;
    --ink:#292316;
    --muted:rgba(41,35,22,.55);
    --line:rgba(41,35,22,.13);
    --accent:#d84e1f;
    --danger:#b3361a;
    --sh1:0 1px 2px rgba(41,35,22,.14), 0 10px 24px -8px rgba(41,35,22,.22);
    --sh2:0 2px 4px rgba(41,35,22,.16), 0 18px 40px -10px rgba(41,35,22,.32);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
  body{
    height:100vh;
    height:100dvh;
    display:flex; flex-direction:column;
    font-family:"Golos Text",system-ui,sans-serif; color:var(--ink); background:var(--paper);
  }
  button{font-family:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  svg.defs{position:absolute; width:0; height:0; overflow:hidden;}
  .ic{width:19px;height:19px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  /* ---------- Шапка ---------- */
  #topbar{
    height:54px; flex:none; display:flex; align-items:center; gap:8px; padding:0 14px;
    background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:4px; flex:none;}
  .logo{width:30px;height:30px; background:#ffe08a; border-radius:4px; position:relative; transform:rotate(-3deg);
    box-shadow:0 1px 2px rgba(41,35,22,.25);}
  .logo::after{content:""; position:absolute; top:-5px; left:50%; width:20px; height:9px;
    transform:translateX(-50%) rotate(-5deg); background:rgba(255,255,255,.55);
    border:1px solid rgba(41,35,22,.06); border-radius:1px;}
  .brand-name{font-family:"Unbounded"; font-weight:700; font-size:14px; letter-spacing:.02em; white-space:nowrap;}
  #boardName{
    font:500 14px "Golos Text"; color:var(--ink); background:transparent; border:none;
    border-bottom:1px dashed transparent; padding:4px 2px; outline:none;
    flex:0 1 200px; min-width:70px; width:auto;
  }
  #boardName:hover{border-bottom-color:var(--line);}
  #boardName:focus{border-bottom-color:var(--accent);}
  #savedState{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);
    opacity:0; transition:opacity .5s; margin-left:2px; white-space:nowrap; flex:none;}
  #savedState.show{opacity:1; transition:opacity .12s;}
  #savedState .ic{width:14px;height:14px; stroke-width:2.4;}
  .spacer{flex:1; min-width:4px;}
  .tb-group{display:flex; align-items:center; gap:2px; flex:none;}
  .tb-sep{width:1px; height:22px; background:var(--line); margin:0 6px; flex:none;}
  .hbtn{width:34px;height:34px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:9px; color:var(--ink); flex:none;}
  .hbtn:hover{background:rgba(41,35,22,.07);}
  .hbtn:disabled{opacity:.3; pointer-events:none;}
  .hbtn.danger:hover{background:rgba(179,54,26,.1); color:var(--danger);}
  .hbtn.boards-btn{width:auto; padding:0 10px; gap:7px; font-weight:600; font-size:13px; flex:none;}
  #btnMenu{display:none;}

  /* ---------- Панель досок ---------- */
  #boardPanel{position:fixed; z-index:45; top:60px; left:10px; background:var(--panel2);
    border:1px solid var(--line); border-radius:13px; box-shadow:var(--sh1); width:300px;
    max-width:calc(100vw - 20px); padding:8px; display:flex; flex-direction:column;}
  #boardPanel[hidden]{display:none;}
  .bp-head{font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); padding:8px 10px 6px;}
  #boardList{display:flex; flex-direction:column; gap:2px; max-height:46vh;
    max-height:min(46vh,380px); overflow:auto; -webkit-overflow-scrolling:touch;}
  .bp-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; cursor:pointer;}
  .bp-row:hover{background:rgba(41,35,22,.06);}
  .bp-row.on{background:rgba(216,78,31,.08);}
  .bp-dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(41,35,22,.12);}
  .bp-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .bp-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bp-date{font-size:11px; color:var(--muted);}
  .bp-check{color:var(--accent); width:16px; height:16px; stroke-width:2.6; flex:none;}
  .bp-del{width:28px;height:28px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--muted); opacity:0; transition:opacity .15s, background .15s, color .15s;}
  .bp-del .ic{width:14px;height:14px;}
  .bp-row:hover .bp-del{opacity:1;}
  .bp-del:hover{color:var(--danger); background:rgba(179,54,26,.09);}
  @media (hover:none){ .bp-del{opacity:.5;} }
  #bpNew{display:flex; align-items:center; gap:9px; margin-top:6px; padding:10px; font-size:13.5px;
    font-weight:600; border-radius:9px; border-top:1px solid var(--line); color:var(--accent); flex:none;}
  #bpNew:hover{background:rgba(216,78,31,.07);}
  #bpNew .ic{width:16px;height:16px; stroke-width:2.2;}

  /* выпадающее меню (узкие экраны) */
  #menu{position:absolute; top:58px; right:10px; z-index:40; background:var(--panel2);
    border:1px solid var(--line); border-radius:12px; box-shadow:var(--sh1); padding:6px; min-width:220px;}
  #menu button{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px;
    font-size:13.5px; font-weight:500; border-radius:8px; text-align:left;}
  #menu button:hover{background:rgba(41,35,22,.06);}
  #menu button.danger{color:var(--danger);}
  #menu button.danger:hover{background:rgba(179,54,26,.08);}

  /* ---------- Канва ---------- */
  #viewport{
    flex:1; min-height:0; position:relative; overflow:hidden; touch-action:none;
    background-color:var(--paper);
    background-image:radial-gradient(circle, rgba(74,62,40,.17) 1.2px, transparent 1.7px);
    cursor:grab; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #viewport.panning{cursor:grabbing;}
  #viewport[data-tool="connect"]{cursor:crosshair;}
  #viewport[data-tool="eraser"]{cursor:crosshair;}
  #viewport[data-tool="pen"]{cursor:crosshair;}
  #viewport.spacepan{cursor:grabbing;}
  #world{position:absolute; left:0; top:0; transform-origin:0 0;}
  #linksvg{position:absolute; left:0; top:0; width:20px; height:20px; overflow:visible;}
  #cardsG{position:absolute; left:0; top:0;}
  #pensvg{position:absolute; left:0; top:0; width:20px; height:20px; overflow:visible; pointer-events:none;}
  .pstroke{fill:none; stroke-linecap:round; stroke-linejoin:round;}

  /* стрелки */
  .link-hit{fill:none; stroke:rgba(0,0,0,0); stroke-width:16; cursor:pointer;}
  .link-line{fill:none; stroke:#3a3223; stroke-width:2; pointer-events:none;}
  .link.selected .link-line{stroke:var(--accent); stroke-width:2.4;}
  .link-lab{font:600 13px "Golos Text"; fill:var(--ink); paint-order:stroke;
    stroke:var(--paper); stroke-width:6px; stroke-linejoin:round; text-anchor:middle; pointer-events:none;}
  #tmpLine{fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:7 7; pointer-events:none;}

  /* ---------- Карточки ---------- */
  .card{position:absolute; user-select:none; -webkit-user-select:none; cursor:grab;
    transition:box-shadow .18s, transform .18s;}
  #cardsG.noanim .card{animation:none;}
  .card.lift{transform:rotate(0deg) scale(1.04) !important; box-shadow:var(--sh2); z-index:5;}
  @keyframes cardpop{from{transform:scale(.55) rotate(var(--tilt,0deg)); opacity:0;}}
  .card{animation:cardpop .3s cubic-bezier(.34,1.5,.64,1);}
  .card.selected{outline:2px solid var(--accent); outline-offset:3px;}
  .card.pending{outline:2px dashed var(--accent); outline-offset:4px;}
  .card.conn-target{outline:2px solid var(--accent); outline-offset:3px; opacity:.85;}

  .note{
    width:216px; padding:16px 16px 18px; border-radius:3px;
    background:var(--c,#ffe08a); transform:rotate(var(--tilt,0deg));
    box-shadow:0 1px 2px rgba(41,35,22,.2), 0 8px 20px -6px rgba(41,35,22,.28);
  }
  .note::before,.photo::before{ /* кусочек скотча */
    content:""; position:absolute; top:-11px; left:50%; width:78px; height:23px;
    transform:translateX(-50%) rotate(-2.5deg); background:rgba(255,255,255,.42);
    border:1px solid rgba(41,35,22,.07); box-shadow:0 1px 3px rgba(41,35,22,.1); pointer-events:none;
  }
  .photo::before{transform:translateX(-50%) rotate(2deg);}
  .note-content{
    font-family:"Unbounded"; font-weight:600; font-size:15px; line-height:1.5;
    word-break:break-word; white-space:pre-wrap; outline:none; min-height:100px; color:#241f12;
  }
  [contenteditable]:not([contenteditable="false"]){user-select:text; -webkit-user-select:text; cursor:text;}
  .note-content:empty::before{content:attr(data-ph); color:rgba(41,35,22,.38);}

  /* просто текст */
  .textplate{width:240px; padding:6px 8px; transform:rotate(var(--tilt,0deg));}
  .text-content{
    font:600 17px/1.5 "Golos Text"; color:var(--tc,var(--ink));
    word-break:break-word; white-space:pre-wrap; outline:none; min-height:28px;
  }
  .text-content:empty::before{content:attr(data-ph); color:rgba(41,35,22,.35);}

  /* белая доска (рамка) */
  .boardframe{background:#fff; border-radius:10px;
    border:1px solid rgba(41,35,22,.12);
    box-shadow:0 1px 2px rgba(41,35,22,.07), 0 14px 34px -14px rgba(41,35,22,.2);}

  /* фото */
  .photo{width:260px; background:var(--panel2); padding:9px 9px 12px; border-radius:4px;
    transform:rotate(var(--tilt,0deg));
    box-shadow:0 1px 2px rgba(41,35,22,.2), 0 8px 20px -6px rgba(41,35,22,.26);}
  .img-frame{border-radius:2px; overflow:hidden; background:rgba(41,35,22,.06);}
  .img-frame img{display:block; width:100%; height:auto; pointer-events:none;
    -webkit-user-drag:none; user-select:none;}
  .rz-handle{position:absolute; right:-9px; bottom:-9px; width:24px; height:24px; border-radius:50%;
    background:var(--panel2); border:1.5px solid var(--accent); color:var(--accent);
    box-shadow:0 1px 5px rgba(41,35,22,.25); display:none; align-items:center; justify-content:center;
    cursor:nwse-resize; z-index:4; touch-action:none;}
  .rz-handle .ic{width:11px; height:11px; stroke-width:2.6;}
  .card.selected .rz-handle{display:flex;}

  .todo{
    width:256px; background:var(--panel2); border:1px solid var(--line); border-radius:11px;
    box-shadow:0 1px 2px rgba(41,35,22,.16), 0 10px 24px -8px rgba(41,35,22,.24);
    transform:rotate(var(--tilt,0deg));
  }
  .todo-head{display:flex; align-items:center; gap:8px; padding:11px 13px;
    background:var(--c,#b5d8e6); border-radius:10px 10px 0 0; border-bottom:1px solid rgba(41,35,22,.08);}
  .todo-title{flex:1; font-weight:600; font-size:15px; line-height:1.25; outline:none; word-break:break-word;}
  .todo-title:empty::before{content:attr(data-ph); color:rgba(41,35,22,.4);}
  .todo-count{font-size:11.5px; font-weight:600; color:rgba(41,35,22,.55); white-space:nowrap;}
  .todo-bar{height:3px; background:rgba(41,35,22,.09);}
  .todo-bar i{display:block; height:100%; width:0; background:var(--ink); transition:width .25s;}
  .todo-items{padding:6px 7px 2px;}
  .ti{display:flex; align-items:flex-start; gap:9px; padding:5px 6px 5px 4px; border-radius:7px; position:relative;}
  .ti:hover{background:rgba(41,35,22,.045);}
  .ti-check{width:20px;height:20px; flex:none; margin-top:1px; border:1.6px solid rgba(41,35,22,.45);
    border-radius:6px; display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;}
  .ti-check .ic{width:12px;height:12px; stroke-width:3; color:var(--panel2); opacity:0;}
  .ti.done .ti-check{background:var(--ink); border-color:var(--ink);}
  .ti.done .ti-check .ic{opacity:1;}
  .ti-text{flex:1; font-size:14px; line-height:1.45; word-break:break-word; outline:none; padding-top:1px;}
  .ti-text:empty::before{content:attr(data-ph); color:rgba(41,35,22,.35);}
  .ti.done .ti-text{text-decoration:line-through; opacity:.42;}
  .ti-del{width:20px;height:20px; flex:none; margin:2px -2px 0 0; border-radius:6px; display:flex;
    align-items:center; justify-content:center; color:var(--muted); opacity:0; transition:opacity .15s;}
  .ti-del .ic{width:13px;height:13px; stroke-width:2;}
  .ti:hover .ti-del{opacity:1;}
  .ti-del:hover{color:var(--danger); background:rgba(179,54,26,.08);}
  @media (hover:none){ .ti-del{opacity:.45;} }
  .todo-add{display:flex; align-items:center; gap:7px; margin:2px 7px 8px; padding:7px 9px;
    font-size:13px; font-weight:500; color:var(--muted); border-radius:8px; width:calc(100% - 14px);}
  .todo-add:hover{background:rgba(41,35,22,.05); color:var(--ink);}
  .todo-add .ic{width:15px;height:15px;}

  .card-edit{position:absolute; top:-13px; right:-13px; width:30px; height:30px; border-radius:50%;
    background:var(--panel2); border:1px solid var(--line); box-shadow:0 2px 6px rgba(41,35,22,.2);
    display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.75);
    transition:opacity .15s, transform .15s, background .15s, color .15s; z-index:3;}
  .card-edit .ic{width:14px;height:14px;}
  .card.selected .card-edit, .card.editing .card-edit{opacity:1; transform:scale(1);}
  .card.editing .card-edit{display:none;}
  .card-edit:hover{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* ---------- Пустая доска ---------- */
  #emptyHint{position:absolute; left:0; top:0; right:0; bottom:0; display:flex;
    align-items:center; justify-content:center; pointer-events:none; z-index:2;}
  #emptyHint > div{text-align:center; padding:0 24px;}
  #emptyHint h2{font-family:"Unbounded"; font-weight:700; font-size:24px;
    font-size:clamp(20px, 6vw, 28px); color:rgba(41,35,22,.75);}
  #emptyHint p{margin-top:8px; font-size:14px; color:var(--muted); max-width:420px;}
  #emptyHint[hidden]{display:none;}

  /* ---------- Панель свойств ---------- */
  #props{position:fixed; z-index:12; top:66px; left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--line); border-radius:13px; box-shadow:var(--sh1);
    padding:10px 12px; display:flex; flex-direction:column; gap:9px; max-width:calc(100vw - 16px);}
  #props[hidden]{display:none;}
  .props-head{font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
  .props-note{font-size:11.5px; line-height:1.45; color:var(--muted); max-width:250px;}
  .swatches{display:flex; gap:7px;}
  .swatch{width:26px;height:26px; border-radius:8px; border:1px solid rgba(41,35,22,.15); transition:transform .12s;}
  .swatch:hover{transform:scale(1.12);}
  .swatch.active{outline:2px solid var(--ink); outline-offset:2px;}
  .penw{width:34px;height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center;}
  .penw:hover{background:rgba(41,35,22,.07);}
  .penw i{display:block; border-radius:50%; background:currentColor;}
  .penw.active{outline:2px solid var(--ink); outline-offset:2px;}
  .props-actions{display:flex; gap:4px; flex-wrap:wrap;}
  .pbtn{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500;
    padding:7px 9px; border-radius:8px;}
  .pbtn:hover{background:rgba(41,35,22,.06);}
  .pbtn .ic{width:15px;height:15px;}
  .pbtn.on{background:var(--ink); color:var(--panel2);}
  .pbtn.danger{color:var(--danger);}
  .pbtn.danger:hover{background:rgba(179,54,26,.09);}
  #linkLabel{font:500 13px "Golos Text"; color:var(--ink); background:rgba(41,35,22,.045);
    border:1px solid var(--line); border-radius:8px; padding:7px 10px; outline:none; width:230px; max-width:100%;}
  #linkLabel:focus{border-color:var(--accent);}

  /* ---------- Инструменты ---------- */
  #tools{position:fixed; z-index:12; left:14px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:3px; background:var(--panel2); border:1px solid var(--line);
    border-radius:13px; box-shadow:var(--sh1); padding:5px;}
  .tbtn{width:44px;height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    color:var(--ink); transition:background .12s, color .12s;}
  .tbtn:hover{background:rgba(41,35,22,.07);}
  .tbtn.active{background:var(--ink); color:var(--panel);}
  .tbtn .ic{width:20px;height:20px;}

  /* ---------- Зум ---------- */
  #zoomui{position:fixed; z-index:12; right:14px; bottom:14px; display:flex; align-items:center; gap:2px;
    background:var(--panel2); border:1px solid var(--line); border-radius:11px; box-shadow:var(--sh1); padding:4px;}
  #zoomui .hbtn{width:32px;height:32px;}
  #zoomPct{font-size:12.5px; font-weight:600; min-width:46px; text-align:center; border-radius:8px; padding:8px 2px;}
  #zoomPct:hover{background:rgba(41,35,22,.07);}

  /* ---------- Подсказка режима стрелки ---------- */
  #connectHint{position:fixed; z-index:12; top:64px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--panel); font-size:13px; font-weight:500; padding:8px 16px;
    border-radius:99px; box-shadow:var(--sh1); white-space:nowrap; max-width:calc(100vw - 20px);
    overflow:hidden; text-overflow:ellipsis;}
  #connectHint[hidden]{display:none;}

  /* ---------- Тосты ---------- */
  #toasts{position:fixed; z-index:60; bottom:80px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
  .toast{display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--panel);
    font-size:13px; font-weight:500; padding:9px 16px; border-radius:10px; box-shadow:var(--sh2);
    opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast .ic{width:14px;height:14px; stroke-width:2.6;}

  /* ---------- Модалка ---------- */
  #scrim{position:fixed; left:0; top:0; right:0; bottom:0; z-index:50; background:rgba(41,35,22,.38);
    display:flex; align-items:center; justify-content:center; padding:16px;}
  #scrim[hidden]{display:none;}
  #modal{background:var(--panel2); border-radius:16px; box-shadow:var(--sh2); width:100%;
    max-width:420px; padding:22px; animation:cardpop .25s cubic-bezier(.34,1.4,.64,1);
    max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
  #modalTitle{font-family:"Unbounded"; font-weight:600; font-size:15px; margin-bottom:10px;}
  #modalBody{font-size:14px; line-height:1.55; color:var(--ink);}
  .modal-input{width:100%; font:500 14px "Golos Text"; color:var(--ink); background:rgba(41,35,22,.04);
    border:1px solid var(--line); border-radius:9px; padding:10px 12px; outline:none; margin-top:4px;}
  .modal-input:focus{border-color:var(--accent);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .mbtn{font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:9px;}
  .mbtn.ghost{color:var(--muted);} .mbtn.ghost:hover{background:rgba(41,35,22,.06); color:var(--ink);}
  .mbtn.solid{background:var(--ink); color:var(--panel2);} .mbtn.solid:hover{opacity:.88;}
  .mbtn.red{background:var(--danger); color:#fff;} .mbtn.red:hover{opacity:.88;}
  .help-list{list-style:none; display:flex; flex-direction:column; gap:9px;}
  .help-list li{display:flex; gap:10px; align-items:baseline;}
  .help-list b{flex:none; width:150px; font-size:12.5px; font-weight:600;}
  .help-list span{font-size:12.5px; color:var(--muted);}
  @media (max-width:520px){ .help-list b{width:118px;} }

  /* ---------- Адаптив ---------- */

<script>
'use strict';
/* ===== Страховка: если скрипт упадёт — покажем понятную плашку вместо «мёртвого» экрана ===== */
var __errShown = false;
function __fatal(msg) {
  if (__errShown) return;
  __errShown = true;
  try {
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:999;background:#b3361a;color:#fff;padding:10px 14px;border-radius:10px;font:500 13px/1.45 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3)';
    el.textContent = msg;
    (document.body || document.documentElement).appendChild(el);
  } catch (e) {}
}
window.addEventListener('error', function (e) {
  __fatal('Ошибка скрипта: ' + ((e && e.message) || 'неизвестно') + '. Обновите страницу (Ctrl+F5).');
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason;
  __fatal('Ошибка: ' + ((r && r.message) || r || 'неизвестно'));
});

/* ================= Утилиты ================= */
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
const randomTilt = () => Math.round((Math.random() * 2 - 1) * 140) / 100;
const r1 = n => Math.round(n * 10) / 10;

/* ================= Хранилище досок ================= */
const KEY = 'scotch.board.v1';          // legacy (одиночная доска из старой версии)
const IDX = 'scotch.idx.v1';            // список досок
const ACT = 'scotch.act.v1';            // активная доска
const PENKEY = 'scotch.pen.v1';         // настройки кисти
const bkey = id => 'scotch.b.' + id;

const GRID = 26;
const PALETTE = [
  { id: 'yellow', c: '#ffe08a' },
  { id: 'peach',  c: '#ffc9a0' },
  { id: 'mint',   c: '#bfe3bd' },
  { id: 'sky',    c: '#b5d8e6' },
  { id: 'lilac',  c: '#d8cbea' },
];
const TEXT_COLORS = [
  { id: 'ink',    c: '#292316' },
  { id: 'rust',   c: '#c2431c' },
  { id: 'forest', c: '#3e6b4a' },
  { id: 'sea',    c: '#2b5d8a' },
  { id: 'plum',   c: '#7a4a78' },
];
const PEN_WIDTHS = [2, 5, 10];
const ACCENT = '#d84e1f';
const colorOf = id => (PALETTE.find(p => p.id === id) || PALETTE[0]).c;
const textColorOf = id => (TEXT_COLORS.find(p => p.id === id) || TEXT_COLORS[0]).c;

/* демо-фото для приветственной доски (крошечный svg) */
const DEMO_PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'>" +
  "<rect width='400' height='300' fill='#bcdcec'/>" +
  "<circle cx='318' cy='64' r='30' fill='#ffdf8e'/>" +
  "<path d='M-10 240 118 118l92 88 64-58 146 128v44H-10z' fill='#6f9678'/>" +
  "<path d='M-10 272l92-64 112 84 74-50 142 74v20H-10z' fill='#5b8266'/>" +
  "</svg>");

/* ================= Состояние ================= */
const state = { name: '', cards: [], links: [], strokes: [], view: { x: 0, y: 0, s: 1 } };
const ui = { tool: 'select', sel: null, pendingConnect: null, replaceTarget: null, penColor: '#292316', penW: 5 };
let boardId = null, idx = [], quotaWarned = false;
let pendingFit = false; // true = после сборки нужно подогнать вид под содержимое

/* state.view никогда не должен быть null — страховка на все случаи */
function ensureView() {
  if (!state.view || typeof state.view.s !== 'number' || typeof state.view.x !== 'number') {
    state.view = { x: 0, y: 0, s: 1 };
  }
}

const viewport = $('#viewport'), world = $('#world'), cardsG = $('#cardsG');
const linksG = $('#linksG'), tmpLine = $('#tmpLine'), strokesG = $('#strokesG');
const propsEl = $('#props'), connectHint = $('#connectHint'), emptyHint = $('#emptyHint');

const cardById = new Map(), elById = new Map(), cardH = new Map(), linkEls = new Map(), strokeEls = new Map();

const getCard = id => cardById.get(id);
const getEl = id => elById.get(id);
const strokeById = id => { for (const s of state.strokes) if (s.id === id) return s; return null; };
const rectOf = c => ({
  x: c.x, y: c.y, w: c.w,
  h: c.type === 'image' ? Math.round(c.w * (c.aspect || 0.75))
   : c.type === 'board' ? (c.h || 600)
   : (cardH.get(c.id) || 80)
});

function saveIndex() { try { localStorage.setItem(IDX, JSON.stringify(idx)); } catch (e) {} }
function setActive() { try { localStorage.setItem(ACT, boardId); } catch (e) {} }
function persistPen() { try { localStorage.setItem(PENKEY, JSON.stringify({ color: ui.penColor, w: ui.penW })); } catch (e) {} }

function saveNow() {
  try {
    localStorage.setItem(bkey(boardId), JSON.stringify({ name: state.name, cards: state.cards, links: state.links, strokes: state.strokes, view: state.view }));
    const it = idx.find(b => b.id === boardId);
    if (it) { it.name = state.name || it.name; it.ts = Date.now(); saveIndex(); }
    const el = $('#savedState');
    el.classList.add('show');
    clearTimeout(saveNow._t);
    saveNow._t = setTimeout(() => el.classList.remove('show'), 1400);
  } catch (e) {
    if (!quotaWarned) {
      quotaWarned = true;
      toast('Хранилище браузера недоступно или заполнено — сделайте бэкап через экспорт');
    }
  }
}
let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 450); }

/* ================= Санитизация данных ================= */
function sanitizeData(raw) {
  raw = raw || {};
  const types = ['note', 'todo', 'text', 'image', 'board'];
  const cards = (Array.isArray(raw.cards) ? raw.cards : []).filter(c => c && types.indexOf(c.type) >= 0).map(c => {
    const t = c.type;
    const base = { id: c.id || uid(), type: t, x: Math.round(+c.x || 0), y: Math.round(+c.y || 0) };
    if (t === 'note') return Object.assign(base, { w: 216, color: PALETTE.some(p => p.id === c.color) ? c.color : 'yellow', tilt: num(c.tilt, randomTilt()), text: typeof c.text === 'string' ? c.text : '' });
    if (t === 'text') return Object.assign(base, { w: 240, color: TEXT_COLORS.some(p => p.id === c.color) ? c.color : 'ink', tilt: num(c.tilt, 0), text: typeof c.text === 'string' ? c.text : '' });
    if (t === 'image') {
      if (!(typeof c.src === 'string' && c.src.indexOf('data:image') === 0)) return null;
      return Object.assign(base, { w: clamp(Math.round(+c.w || 260), 90, 1400), aspect: num(+c.aspect, 0) > 0 ? +c.aspect : 0.75, tilt: num(c.tilt, randomTilt() * 0.7), src: c.src });
    }
    if (t === 'board') return Object.assign(base, { w: clamp(Math.round(+c.w || 900), 160, 4000), h: clamp(Math.round(+c.h || 600), 120, 4000), tilt: 0 });
    return Object.assign(base, {
      w: 256, color: PALETTE.some(p => p.id === c.color) ? c.color : 'sky', tilt: num(c.tilt, randomTilt()),
      title: typeof c.title === 'string' ? c.title : '',
      items: (Array.isArray(c.items) ? c.items : []).map(it => ({ id: (it && it.id) || uid(), text: String((it && it.text) || ''), done: !!(it && it.done) }))
    });
  }).filter(Boolean);
  const ids = new Set(cards.map(c => c.id));
  const links = (Array.isArray(raw.links) ? raw.links : [])
    .filter(l => l && ids.has(l.from) && ids.has(l.to))
    .map(l => ({ id: l.id || uid(), from: l.from, to: l.to, label: String(l.label || ''), dash: !!l.dash }));
  const strokes = (Array.isArray(raw.strokes) ? raw.strokes : []).filter(s => s && Array.isArray(s.pts) && s.pts.length >= 2).map(s => {
    let pts = s.pts.filter(n => typeof n === 'number' && isFinite(n)).map(n => r1(n));
    if (pts.length % 2) pts = pts.slice(0, -1);
    return {
      id: s.id || uid(),
      pts: pts,
      color: typeof s.color === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(s.color) ? s.color : '#292316',
      w: clamp(Math.round(+s.w || 3), 1, 40)
    };
  }).filter(s => s.pts.length >= 2);
  return { cards: cards, links: links, strokes: strokes };
}

/* ================= Вид (панорама/зум) ================= */
function applyView() {
  ensureView();
  const v = state.view;
  world.style.transform = 'translate(' + v.x + 'px, ' + v.y + 'px) scale(' + v.s + ')';
  viewport.style.backgroundSize = (GRID * v.s) + 'px ' + (GRID * v.s) + 'px';
  viewport.style.backgroundPosition = v.x + 'px ' + v.y + 'px';
  $('#zoomPct').textContent = Math.round(v.s * 100) + '%';
}
function screenToWorld(cx, cy) {
  const r = viewport.getBoundingClientRect();
  return { x: (cx - r.left - state.view.x) / state.view.s, y: (cy - r.top - state.view.y) / state.view.s };
}
function zoomAt(cx, cy, factor) {
  ensureView();
  const v = state.view;
  const s2 = clamp(v.s * factor, 0.15, 3);
  v.x = cx - (cx - v.x) * s2 / v.s;
  v.y = cy - (cy - v.y) * s2 / v.s;
  v.s = s2;
  applyView(); scheduleSave();
}
function applyOrFit() {
  if (pendingFit) { pendingFit = false; requestAnimationFrame(fitAll); }
  else applyView();
}
function measureSync() { for (const c of state.cards) { const el = getEl(c.id); if (el) cardH.set(c.id, el.offsetHeight); } }
function fitAll() {
  ensureView();
  const r = viewport.getBoundingClientRect();
  if (!state.cards.length && !state.strokes.length) { state.view = { x: r.width / 2, y: r.height / 2, s: 1 }; applyView(); return; }
  measureSync();
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const c of state.cards) {
    minx = Math.min(minx, c.x); miny = Math.min(miny, c.y);
    maxx = Math.max(maxx, c.x + c.w); maxy = Math.max(maxy, c.y + rectOf(c).h);
  }
  for (const s of state.strokes) {
    for (let i = 0; i + 1 < s.pts.length; i += 2) {
      if (s.pts[i] < minx) minx = s.pts[i];
      if (s.pts[i] > maxx) maxx = s.pts[i];
      if (s.pts[i + 1] < miny) miny = s.pts[i + 1];
      if (s.pts[i + 1] > maxy) maxy = s.pts[i + 1];
    }
  }
  const pad = 70, bw = Math.max(1, maxx - minx), bh = Math.max(1, maxy - miny);
  const s = clamp(Math.min((r.width - pad * 2) / bw, (r.height - pad * 2) / bh), 0.15, 1.25);
  state.view.s = s;
  state.view.x = (r.width - bw * s) / 2 - minx * s;
  state.view.y = (r.height - bh * s) / 2 - miny * s;
  applyView(); scheduleSave();
}

/* ================= История ================= */
let hist = [], hi = -1;
const snapshot = () => JSON.stringify({ cards: state.cards, links: state.links, strokes: state.strokes });
function pushHistory() {
  const snap = snapshot();
  if (hist[hi] === snap) return;
  hist = hist.slice(0, hi + 1);
  hist.push(snap);
  if (hist.length > 60) hist.shift();
  hi = hist.length - 1;
  updateHistBtns();
}
function restore(snap) {
  const d = JSON.parse(snap);
  state.cards = d.cards; state.links = d.links; state.strokes = d.strokes || [];
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  ui.sel = null;
  rebuildAll(); renderProps(); scheduleSave();
}
function resetHistory() { hist = []; hi = -1; pushHistory(); }
function undo() { if (hi > 0) { hi--; restore(hist[hi]); updateHistBtns(); } }
function redo() { if (hi < hist.length - 1) { hi++; restore(hist[hi]); updateHistBtns(); } }
function updateHistBtns() { $('#btnUndo').disabled = hi <= 0; $('#btnRedo').disabled = hi >= hist.length - 1; }

/* ================= Карточки ================= */
function makeCard(type, x, y) {
  const base = { id: uid(), type, x: Math.round(x), y: Math.round(y) };
  if (type === 'note') return Object.assign(base, { w: 216, color: PALETTE[Math.floor(Math.random() * PALETTE.length)].id, tilt: randomTilt(), text: '' });
  if (type === 'text') return Object.assign(base, { w: 240, color: 'ink', tilt: 0, text: '' });
  if (type === 'image') return Object.assign(base, { w: 260, aspect: 0.75, tilt: randomTilt() * 0.7, src: '' });
  if (type === 'board') return Object.assign(base, { w: 900, h: 600, tilt: 0 });
  return Object.assign(base, { w: 256, color: PALETTE[Math.floor(Math.random() * PALETTE.length)].id, tilt: randomTilt(), title: '', items: [] });
}
function makeHandle(title) {

function updateTodoMeta(card) {

function updateEmptyHint() { emptyHint.hidden = state.cards.length > 0 || state.strokes.length > 0; }

function addCard(card, editRightAway, atBottom) {

function deleteCard(id) {

/* ================= Редактирование текста ================= */
function setEditable(node, on) {
  if (!on) { node.contentEditable = 'false'; return; }
  try { node.contentEditable = 'plaintext-only'; }
  catch (e) {
    node.contentEditable = 'true';
    node.addEventListener('paste', e => {
      e.preventDefault();

    });
  }
}
function placeCaretEnd(el) {

}
function blurActive() {

}
function editContent(card, selector) {

}
function editNote(card) { editContent(card, '.note-content'); }
function editText(card) { editContent(card, '.text-content'); }
function commitContent(card, selector, setter) {

  measureSoon(); saveNow();
}
function commitNote(card) {

}
function commitText(card) {

}
function editTodoTitle(card) {

/* ================= Стрелки ================= */
function edgePoint(r, tx, ty) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const dx = tx - cx, dy = ty - cy;
  const len = Math.hypot(dx, dy) || 1;
  const t = Math.min(
    Math.abs(dx) > 1e-6 ? (r.w / 2 + 5) / Math.abs(dx) : 1e9,
    Math.abs(dy) > 1e-6 ? (r.h / 2 + 5) / Math.abs(dy) : 1e9
  );
  return { x: cx + dx * t, y: cy + dy * t, ux: dx / len, uy: dy / len };
}
function linkGeometry(l) {
  const a = getCard(l.from), b = getCard(l.to);
  if (!a || !b) return null;
  const ra = rectOf(a), rb = rectOf(b);
  const p1 = edgePoint(ra, rb.x + rb.w / 2, rb.y + rb.h / 2);
  const p2 = edgePoint(rb, ra.x + ra.w / 2, ra.y + ra.h / 2);
  const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const bend = clamp(d * 0.4, 30, 170);
  const c1x = p1.x + p1.ux * bend, c1y = p1.y + p1.uy * bend;
  const c2x = p2.x + p2.ux * bend, c2y = p2.y + p2.uy * bend;
  const mx = (p1.x + 3 * c1x + 3 * c2x + p2.x) / 8;
  const my = (p1.y + 3 * c1y + 3 * c2y + p2.y) / 8;
  return {
    d: 'M' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
       ' C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ', ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) +
       ', ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1),
    mx, my
  };
}
function syncLinks() {
  const alive = new Set(state.links.map(l => l.id));
  for (const [id, g] of linkEls) if (!alive.has(id)) { g.remove(); linkEls.delete(id); }
  for (const l of state.links) {
    if (linkEls.has(l.id)) continue;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'link');
    g.dataset.id = l.id;
    const hit = document.createElementNS(NS, 'path'); hit.setAttribute('class', 'link-hit');
    const line = document.createElementNS(NS, 'path'); line.setAttribute('class', 'link-line'); line.setAttribute('marker-end', 'url(#mInk)');
    const lab = document.createElementNS(NS, 'text'); lab.setAttribute('class', 'link-lab');
    g.append(hit, line, lab);
    linksG.appendChild(g);
    linkEls.set(l.id, g);
  }
}
function layoutLinks() {
  for (const l of state.links) {
    const g = linkEls.get(l.id); if (!g) continue;
    const geo = linkGeometry(l); if (!geo) continue;
    g.children[0].setAttribute('d', geo.d);
    g.children[1].setAttribute('d', geo.d);
    g.children[1].setAttribute('stroke-dasharray', l.dash ? '8 8' : 'none');
    const lab = g.children[2];
    lab.setAttribute('x', geo.mx); lab.setAttribute('y', geo.my - 8);
    lab.textContent = l.label || '';
    lab.style.display = l.label ? '' : 'none';
  }
}
let layoutRaf = 0;
function scheduleLayout() {
  if (layoutRaf) return;
  layoutRaf = requestAnimationFrame(() => { layoutRaf = 0; layoutLinks(); });
}
let measureRaf = 0;
function measureSoon() {
  if (measureRaf) return;
  measureRaf = requestAnimationFrame(() => {
    measureRaf = 0;
    for (const c of state.cards) { const el = getEl(c.id); if (el) cardH.set(c.id, el.offsetHeight); }
    layoutLinks();
  });
}
function createLink(from, to) {
  pushHistory();
  const l = { id: uid(), from, to, label: '', dash: false };
  state.links.push(l);
  syncLinks(); layoutLinks();
  selectLink(l.id);
  saveNow();
}
function deleteLink(id) {
  pushHistory();
  state.links = state.links.filter(l => l.id !== id);
  syncLinks();
  if (ui.sel && ui.sel.id === id) deselect();
  saveNow();
}
function hitTestCard(wx, wy) {
  for (let i = state.cards.length - 1; i >= 0; i--) {
    const c = state.cards[i], r = rectOf(c);
    if (wx >= r.x - 3 && wx <= r.x + r.w + 3 && wy >= r.y - 3 && wy <= r.y + r.h + 3) return c;
  }
  return null;
}

/* ================= Рисование (кисть) ================= */
function strokeD(p) {
  const n = p.length;
  if (n < 4) {
    const x = p[0], y = p[1];
    return 'M' + r1(x) + ' ' + r1(y) + 'L' + r1(x + 0.01) + ' ' + r1(y);
  }
  let d = 'M' + r1(p[0]) + ' ' + r1(p[1]);
  for (let i = 2; i < n - 2; i += 2) {
    const mx = r1((p[i] + p[i + 2]) / 2), my = r1((p[i + 1] + p[i + 3]) / 2);
    d += 'Q' + r1(p[i]) + ' ' + r1(p[i + 1]) + ' ' + mx + ' ' + my;
  }
  d += 'L' + r1(p[n - 2]) + ' ' + r1(p[n - 1]);
  return d;
}
function ensureStrokeEl(s) {
  if (strokeEls.has(s.id)) return strokeEls.get(s.id);
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('class', 'pstroke');
  p.setAttribute('d', strokeD(s.pts));
  p.setAttribute('stroke', s.color);
  p.setAttribute('stroke-width', s.w);
  strokesG.appendChild(p);
  strokeEls.set(s.id, p);
  return p;
}
function syncStrokes() {
  const alive = new Set(state.strokes.map(s => s.id));
  for (const [id, p] of strokeEls) if (!alive.has(id)) { p.remove(); strokeEls.delete(id); }
  for (const s of state.strokes) ensureStrokeEl(s);
}
function removeStroke(id) {
  state.strokes = state.strokes.filter(s => s.id !== id);
  const p = strokeEls.get(id);
  if (p) { p.remove(); strokeEls.delete(id); }
}
function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}
function hitStroke(wx, wy, th) {
  for (let i = state.strokes.length - 1; i >= 0; i--) {
    const s = state.strokes[i], p = s.pts, lim = th + s.w / 2;
    if (p.length === 2) {
      if (Math.hypot(wx - p[0], wy - p[1]) <= lim) return s;
      continue;
    }
    for (let j = 0; j + 3 < p.length; j += 2) {
      if (distSeg(wx, wy, p[j], p[j + 1], p[j + 2], p[j + 3]) <= lim) return s;
    }
  }
  return null;
}
function deleteStroke(id) {
  pushHistory();
  removeStroke(id);
  if (ui.sel && ui.sel.id === id) deselect();
  updateEmptyHint(); saveNow();
}

/* ================= Выделение и панель свойств ================= */
function clearSelVisual() {

  else if (ui.sel.kind === 'link') { const g = linkEls.get(ui.sel.id); if (g) { g.classList.remove('selected'); g.children[1].setAttribute('marker-end', 'url(#mInk)'); } }
  else if (ui.sel.kind === 'stroke') {
    const p = strokeEls.get(ui.sel.id);
    if (p) { const s = strokeById(ui.sel.id); p.setAttribute('stroke', s ? s.color : '#292316'); }
  }
}
function selectCard(id) {

function selectLink(id) {

function swatchHtml(pal, cur, useHex) {
  return '<div class="swatches">' + pal.map(p => {
    const val = useHex ? p.c : p.id;
    const act = useHex ? p.c === cur : p.id === cur;
    return '<button class="swatch ' + (act ? 'active' : '') + '" data-color="' + val + '" style="background:' + p.c + '" title="Цвет"></button>';
  }).join('') + '</div>';
}
function widthsHtml(cur) {
  return '<div class="swatches">' + PEN_WIDTHS.map((w, i) => {
    const act = (w === 2 && cur <= 3) || (w === 5 && cur > 3 && cur <= 7) || (w === 10 && cur > 7);
    const d = 6 + i * 4;
    return '<button class="penw ' + (act ? 'active' : '') + '" data-pw="' + w + '" title="Толщина"><i style="width:' + d + 'px;height:' + d + 'px"></i></button>';
  }).join('') + '</div>';
}
function renderProps() {
  if (!ui.sel) {
    if (ui.tool === 'pen') {
      propsEl.innerHTML = '<div class="props-head">Кисть</div>' +
        swatchHtml(TEXT_COLORS, ui.penColor, true) + widthsHtml(ui.penW) +
        '<div class="props-note">Рисуйте прямо на доске. Ластик стирает линии движением.</div>';
      propsEl.hidden = false;
      return;
    }
    propsEl.hidden = true; return;
  }
  if (ui.pendingConnect) { propsEl.hidden = true; return; }
  let html = '';
  if (ui.sel.kind === 'card') {
    const c = getCard(ui.sel.id); if (!c) { propsEl.hidden = true; return; }
    const names = { note: 'Стикер', todo: 'Список дел', text: 'Просто текст', image: 'Фото', board: 'Белая доска' };
    html += '<div class="props-head">' + (names[c.type] || '') + '</div>';
    if (c.type === 'note' || c.type === 'todo') html += swatchHtml(PALETTE, c.color, false);
    else if (c.type === 'text') html += swatchHtml(TEXT_COLORS, c.color, false);
    html += '<div class="props-actions">';
    if (c.type === 'image') {
      html += '<button class="pbtn" data-act="replace" title="Заменить фото"><svg class="ic"><use href="#i-image"/></svg><span>Заменить</span></button>';
    } else if (c.type !== 'board') {
      html += '<button class="pbtn" data-act="edit" title="Редактировать текст"><svg class="ic"><use href="#i-pencil"/></svg><span>Текст</span></button>';
    }
    html += '<button class="pbtn" data-act="back" title="На задний план"><svg class="ic"><use href="#i-down"/></svg><span>Назад</span></button>' +
      '<button class="pbtn" data-act="front" title="На передний план"><svg class="ic"><use href="#i-up"/></svg><span>Вперёд</span></button>' +
      '<button class="pbtn" data-act="dup" title="Дублировать (Ctrl+D)"><svg class="ic"><use href="#i-copy"/></svg><span>Копия</span></button>' +
      '<button class="pbtn" data-act="link" title="Соединить стрелкой"><svg class="ic"><use href="#i-connect"/></svg><span>Стрелка</span></button>' +
      '<button class="pbtn danger" data-act="del" title="Удалить (Del)"><svg class="ic"><use href="#i-trash"/></svg><span>Удалить</span></button>' +
      '</div>';
  } else if (ui.sel.kind === 'stroke') {
    const s = strokeById(ui.sel.id); if (!s) { propsEl.hidden = true; return; }
    html += '<div class="props-head">Линия</div>' +
      swatchHtml(TEXT_COLORS, s.color, true) + widthsHtml(s.w) +
      '<div class="props-actions">' +
      '<button class="pbtn danger" data-act="del" title="Удалить (Del)"><svg class="ic"><use href="#i-trash"/></svg><span>Удалить</span></button>' +
      '</div>';
  } else {
    const l = state.links.find(x => x.id === ui.sel.id); if (!l) { propsEl.hidden = true; return; }
    html += '<div class="props-head">Стрелка</div>' +
      '<input id="linkLabel" placeholder="Подпись стрелки" maxlength="80" value="' + esc(l.label) + '">' +
      '<div class="props-actions">' +
      '<button class="pbtn ' + (l.dash ? 'on' : '') + '" data-act="dash" title="Пунктир"><svg class="ic"><use href="#i-dash"/></svg><span>Пунктир</span></button>' +
      '<button class="pbtn danger" data-act="del" title="Удалить (Del)"><svg class="ic"><use href="#i-trash"/></svg><span>Удалить</span></button>' +
      '</div>';
  }
  propsEl.innerHTML = html;
  propsEl.hidden = false;
}
propsEl.addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (sw) {
    if (ui.sel && ui.sel.kind === 'card') {
      const c = getCard(ui.sel.id);
      if (!c) return;
      pushHistory();
      c.color = sw.dataset.color;
      const el = getEl(c.id);
      if (c.type === 'text') el.style.setProperty('--tc', textColorOf(c.color));
      else el.style.setProperty('--c', colorOf(c.color));
      renderProps(); saveNow();
    } else if (ui.sel && ui.sel.kind === 'stroke') {
      const s = strokeById(ui.sel.id);
      if (s) {
        pushHistory();
        s.color = sw.dataset.color;
        const p = strokeEls.get(s.id);
        if (p) p.setAttribute('stroke', s.color);
        renderProps(); saveNow();
      }
    } else if (!ui.sel && ui.tool === 'pen') {
      ui.penColor = sw.dataset.color;
      persistPen(); renderProps();
    }
    return;
  }
  const pw = e.target.closest('[data-pw]');
  if (pw) {
    const v = +pw.dataset.pw;
    if (ui.sel && ui.sel.kind === 'stroke') {
      const s = strokeById(ui.sel.id);
      if (s) {
        pushHistory();
        s.w = v;
        const p = strokeEls.get(s.id);
        if (p) p.setAttribute('stroke-width', v);
        renderProps(); saveNow();
      }
    } else if (!ui.sel && ui.tool === 'pen') {
      ui.penW = v;
      persistPen(); renderProps();
    }
    return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (ui.sel && ui.sel.kind === 'card') {
    const c = getCard(ui.sel.id); if (!c) return;
    if (act === 'edit') { if (c.type === 'note') editNote(c); else if (c.type === 'text') editText(c); else editTodoTitle(c); }
    if (act === 'replace') { ui.replaceTarget = c.id; $('#imgInput').click(); }
    if (act === 'dup') duplicateCard(c.id);
    if (act === 'link') setPending(c.id);
    if (act === 'del') deleteCard(c.id);
    if (act === 'front' || act === 'back') {
      const i = state.cards.findIndex(x => x.id === c.id);
      if (i >= 0) {
        pushHistory();
        const moved = state.cards.splice(i, 1)[0];
        if (act === 'front') state.cards.push(moved); else state.cards.unshift(moved);
        applyCardOrder(); saveNow();
      }
    }
  } else if (ui.sel && ui.sel.kind === 'stroke') {
    if (act === 'del') deleteStroke(ui.sel.id);
  } else if (ui.sel && ui.sel.kind === 'link') {
    const l = state.links.find(x => x.id === ui.sel.id); if (!l) return;
    if (act === 'del') deleteLink(l.id);
    if (act === 'dash') { l.dash = !l.dash; layoutLinks(); renderProps(); saveNow(); }
  }
});
propsEl.addEventListener('input', e => {
  if (e.target.id === 'linkLabel' && ui.sel && ui.sel.kind === 'link') {
    const l = state.links.find(x => x.id === ui.sel.id);

});

/* ================= Режим «стрелка» ================= */
function setPending(id) {
  cancelPending();
  ui.pendingConnect = id;
  setTool('connect');
  const el = getEl(id); if (el) el.classList.add('pending');
  connectHint.textContent = 'Теперь выберите вторую карточку · Esc — отмена';
  connectHint.hidden = false;
  renderProps();
}
function cancelPending() {
  if (ui.pendingConnect) { const el = getEl(ui.pendingConnect); if (el) el.classList.remove('pending'); }
  ui.pendingConnect = null;
  connectHint.hidden = true;
  tmpLine.setAttribute('visibility', 'hidden');
  if (ui.tool === 'connect') setTool('select');
  renderProps();
}

/* ================= Инструменты ================= */
function setTool(t) {
  ui.tool = t;
  viewport.dataset.tool = t;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  renderProps();
}
document.querySelectorAll('.tbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.tool;
    cancelPending();
    if (t === 'photo') { $('#imgInput').click(); return; }
    if (t === 'board') {
      const r = viewport.getBoundingClientRect();
      const w = screenToWorld(r.left + r.width / 2, r.top + r.height / 2);
      addCard(makeCard('board', Math.round(w.x - 450), Math.round(w.y - 300)), false, true);
      setTool('select');
      toast('Белая доска добавлена — тяните уголок для размера');
      return;
    }
    if (t === ui.tool && t !== 'select') setTool('select');
    else setTool(t);
    if (t === 'note' || t === 'todo' || t === 'text') {
      const r = viewport.getBoundingClientRect();
      const w = screenToWorld(r.left + r.width / 2 + (Math.random() * 80 - 40), r.top + r.height / 2 + (Math.random() * 60 - 30));
      const off = t === 'note' ? 108 : t === 'text' ? 120 : 128;
      addCard(makeCard(t, w.x - off, w.y - 40), true);
      setTool('select');
    }
  });
});

/* ================= Фото ================= */
function processFile(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const max = 1280;
        const k = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 800) * k));
        const h = Math.max(1, Math.round((img.naturalHeight || 600) * k));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let src;
        try { src = file.type === 'image/png' ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82); }
        catch (e) { src = fr.result; }
        res({ src: src, aspect: h / w });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function importImages(files) {
  const list = [...files].filter(f => f.type && f.type.indexOf('image/') === 0);
  if (!list.length) return;
  const r = viewport.getBoundingClientRect();
  let n = 0;
  for (const f of list) {
    try {
      const p = await processFile(f);
      const w = screenToWorld(r.left + r.width / 2 + (n % 5) * 36 - 60, r.top + r.height / 2 + (n % 5) * 32 - 60);
      const card = makeCard('image', Math.round(w.x - 130), Math.round(w.y - 90));
      card.src = p.src; card.aspect = p.aspect;
      addCard(card, false);
      n++;
    } catch (e) { toast('Не удалось прочитать изображение'); }
  }
  if (n) toast(n === 1 ? 'Фото прикреплено' : ('Фото прикреплены: ' + n));
}
 $('#imgInput').addEventListener('change', e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  if (ui.replaceTarget) {
    const c = getCard(ui.replaceTarget);
    ui.replaceTarget = null;
    if (c && c.type === 'image') {
      processFile(files[0]).then(p => {
        pushHistory();
        c.src = p.src; c.aspect = p.aspect;
        const cardEl = getEl(c.id);
        if (cardEl) {
          const q = cardEl.querySelector('img');
          if (q) q.src = p.src;
        }
        scheduleLayout(); saveNow();
        toast('Фото заменено');
      }).catch(() => toast('Не удалось прочитать файл'));
    }
    return;
  }
  importImages(files);
});
viewport.addEventListener('dragover', e => e.preventDefault());
viewport.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) importImages(e.dataTransfer.files);
});
window.addEventListener('paste', e => {
  if (typing()) return;
  const files = e.clipboardData && e.clipboardData.files;
  if (files && [...files].some(f => f.type && f.type.indexOf('image/') === 0)) {
    e.preventDefault();
    importImages(files);
  }
});

/* ================= Жесты указателя ================= */
const pointers = new Map();
let gesture = { type: 'none' };
let pinch0 = null;

viewport.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  closeMenu(); closeBoardPanel();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) { // щипок
    if (gesture.type === 'draw') { removeStroke(gesture.id); updateEmptyHint(); }
    gesture = { type: 'pinch' };
    tmpLine.setAttribute('visibility', 'hidden');
    document.querySelectorAll('.conn-target').forEach(el => el.classList.remove('conn-target'));
    blurActive();
    ensureView();
    const pts = [...pointers.values()];
    pinch0 = {
      d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1,
      cx: (pts[0].x + pts[1].x) / 2, cy: (pts[0].y + pts[1].y) / 2,
      view: { x: state.view.x, y: state.view.y, s: state.view.s }
    };
    viewport.setPointerCapture(e.pointerId);
    return;
  }

  const handle = e.target.closest('.rz-handle');
  if (handle) {
    const cardEl = handle.closest('.card');
    const c = getCard(cardEl.dataset.id);
    if (c) {
      selectCard(c.id);
      blurActive();
      gesture = { type: 'resize', id: c.id, w0: c.w, h0: c.h || 0, sx: e.clientX, sy: e.clientY };
      viewport.setPointerCapture(e.pointerId);
    }
    return;
  }

  const cardEl = e.target.closest('.card');
  const linkG = e.target.closest('.link');
  const nodrag = e.target.closest('[data-nodrag]');
  viewport.setPointerCapture(e.pointerId);

  if (ui.tool === 'eraser') {
    const w0 = screenToWorld(e.clientX, e.clientY);
    const hs = hitStroke(w0.x, w0.y, 12 / state.view.s);
    if (hs) {
      pushHistory(); removeStroke(hs.id);
      updateEmptyHint(); scheduleSave();
      gesture = { type: 'none' };
      return;
    }
    if (cardEl) { deleteCard(cardEl.dataset.id); gesture = { type: 'none' }; return; }
    if (linkG) { deleteLink(linkG.dataset.id); gesture = { type: 'none' }; return; }
    gesture = { type: 'erase', hist: false, removed: false, lx: w0.x, ly: w0.y };
    return;
  }
  if (nodrag) { gesture = { type: 'none' }; return; } // кнопки внутри карточек

  if (ui.tool === 'pen') {
    pushHistory();
    const w0 = screenToWorld(e.clientX, e.clientY);
    const s = { id: uid(), pts: [r1(w0.x), r1(w0.y)], color: ui.penColor, w: ui.penW };
    state.strokes.push(s);
    ensureStrokeEl(s);
    updateEmptyHint();
    gesture = { type: 'draw', id: s.id, lx: w0.x, ly: w0.y };
    return;
  }

  if (ui.tool === 'connect') {
    if (cardEl) {
      const id = cardEl.dataset.id;
      gesture = { type: 'connect', from: id, sx: e.clientX, sy: e.clientY, moved: false };
    } else {
      gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, ox: state.view.x, oy: state.view.y, moved: false, bg: true };
    }
    return;
  }
  // инструмент «выбор»
  if (cardEl) {
    const id = cardEl.dataset.id;
    const c = getCard(id);
    selectCard(id);
    gesture = { type: 'card', id: id, c: c, ox: c.x, oy: c.y, sx: e.clientX, sy: e.clientY, moved: false, target: e.target, histDone: false };
  } else if (linkG) {
    gesture = { type: 'link', id: linkG.dataset.id, sx: e.clientX, sy: e.clientY, moved: false };
  } else {
    gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, ox: state.view.x, oy: state.view.y, moved: false, bg: true };
  }
});

viewport.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (gesture.type === 'pinch' && pointers.size >= 2) {
    ensureView();
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
    const cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
    const r = viewport.getBoundingClientRect();
    const s2 = clamp(pinch0.view.s * d / pinch0.d, 0.15, 3);
    const wx = (pinch0.cx - r.left - pinch0.view.x) / pinch0.view.s;
    const wy = (pinch0.cy - r.top - pinch0.view.y) / pinch0.view.s;
    state.view.s = s2;
    state.view.x = (cx - r.left) - wx * s2;
    state.view.y = (cy - r.top) - wy * s2;
    applyView();
    return;
  }

  if (gesture.type === 'pan') {
    if (!gesture.moved && Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 4) {
      gesture.moved = true; viewport.classList.add('panning');
    }
    if (gesture.moved) {
      state.view.x = gesture.ox + e.clientX - gesture.sx;
      state.view.y = gesture.oy + e.clientY - gesture.sy;
      applyView();
    }
  } else if (gesture.type === 'card') {
    const dist = Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy);
    if (!gesture.moved && dist > 4) {
      gesture.moved = true;
      if (!gesture.histDone) { pushHistory(); gesture.histDone = true; }
      getEl(gesture.id).classList.add('lift');
      blurActive();
      window.getSelection().removeAllRanges();
    }
    if (gesture.moved) {
      e.preventDefault();
      gesture.c.x = gesture.ox + (e.clientX - gesture.sx) / state.view.s;
      gesture.c.y = gesture.oy + (e.clientY - gesture.sy) / state.view.s;
      const el = getEl(gesture.id);
      el.style.left = gesture.c.x + 'px';
      el.style.top = gesture.c.y + 'px';
      scheduleLayout();
    }
  } else if (gesture.type === 'resize') {
    const c = getCard(gesture.id); if (!c) return;
    const dx = (e.clientX - gesture.sx) / state.view.s;
    const dy = (e.clientY - gesture.sy) / state.view.s;
    const el = getEl(c.id);
    if (c.type === 'board') {
      c.w = Math.round(clamp(gesture.w0 + dx, 160, 4000));
      c.h = Math.round(clamp(gesture.h0 + dy, 120, 4000));
      if (el) { el.style.width = c.w + 'px'; el.style.height = c.h + 'px'; }
    } else {
      c.w = Math.round(clamp(gesture.w0 + (dx + dy) / 2, 90, 1400));
      if (el) el.style.width = c.w + 'px';
    }
    scheduleLayout();
  } else if (gesture.type === 'draw') {
    const s = strokeById(gesture.id); if (!s) return;
    const w = screenToWorld(e.clientX, e.clientY);
    const minD = 1.2 / state.view.s;
    if (Math.hypot(w.x - gesture.lx, w.y - gesture.ly) >= minD) {
      s.pts.push(r1(w.x), r1(w.y));
      gesture.lx = w.x; gesture.ly = w.y;
      const p = strokeEls.get(s.id);
      if (p) p.setAttribute('d', strokeD(s.pts));
    }
  } else if (gesture.type === 'erase') {
    const w = screenToWorld(e.clientX, e.clientY);
    const hs = hitStroke(w.x, w.y, 12 / state.view.s);
    if (hs) {
      if (!gesture.hist) { pushHistory(); gesture.hist = true; }
      removeStroke(hs.id);
      gesture.removed = true;
      updateEmptyHint();
    }
  } else if (gesture.type === 'connect') {
    if (!gesture.moved && Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 5) {
      gesture.moved = true;
      connectHint.textContent = 'Отпустите над второй карточкой';
      connectHint.hidden = false;
    }
    if (gesture.moved) {
      const from = getCard(gesture.from);
      const w = screenToWorld(e.clientX, e.clientY);
      const r = rectOf(from);
      const p1 = edgePoint(r, w.x, w.y);
      tmpLine.setAttribute('d', 'M' + p1.x + ' ' + p1.y + ' L' + w.x + ' ' + w.y);
      tmpLine.setAttribute('visibility', 'visible');
      const over = hitTestCard(w.x, w.y);
      document.querySelectorAll('.conn-target').forEach(el => el.classList.remove('conn-target'));
      if (over && over.id !== gesture.from) getEl(over.id).classList.add('conn-target');
    }
  } else if (gesture.type === 'link') {
    if (Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 5) gesture.moved = true;
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  viewport.classList.remove('panning');

  if (gesture.type === 'pinch') {
    if (pointers.size < 2) { gesture = { type: 'none' }; pinch0 = null; scheduleSave(); }
    return;
  }
  if (e.type === 'pointercancel') {
    if (gesture.type === 'draw') { removeStroke(gesture.id); updateEmptyHint(); }
    document.querySelectorAll('.card.lift').forEach(el => el.classList.remove('lift'));
    document.querySelectorAll('.conn-target').forEach(el => el.classList.remove('conn-target'));
    tmpLine.setAttribute('visibility', 'hidden');
    gesture = { type: 'none' };
    return;
  }

  const tap = g => !g.moved;

  if (gesture.type === 'resize') {
    scheduleSave();
  } else if (gesture.type === 'draw') {
    scheduleSave();
  } else if (gesture.type === 'erase') {
    if (gesture.removed) scheduleSave();
  } else if (gesture.type === 'pan' && tap(gesture) && gesture.bg) {
    const w = screenToWorld(e.clientX, e.clientY);
    const hs = hitStroke(w.x, w.y, 10 / state.view.s);
    if (hs) selectStroke(hs.id);
    else if (ui.pendingConnect) cancelPending();
    else deselect();
  } else if (gesture.type === 'card') {
    const el = getEl(gesture.id);
    if (el) el.classList.remove('lift');
    if (gesture.moved) { scheduleSave(); }
    else if (gesture.target.closest('.ti-text')) {
      const row = gesture.target.closest('.ti');
      const c = gesture.c;
      const item = c.items.find(i => i.id === row.dataset.item);
      if (item) makeItemEditable(c, item);
    }
  } else if (gesture.type === 'link') {
    if (tap(gesture)) selectLink(gesture.id);
  } else if (gesture.type === 'connect') {
    document.querySelectorAll('.conn-target').forEach(el => el.classList.remove('conn-target'));
    tmpLine.setAttribute('visibility', 'hidden');
    if (tap(gesture)) {
      if (ui.pendingConnect === gesture.from) cancelPending();
      else if (ui.pendingConnect && ui.pendingConnect !== gesture.from) {
        createLink(ui.pendingConnect, gesture.from);
        cancelPending();
      } else setPending(gesture.from);
    } else {
      const w = screenToWorld(e.clientX, e.clientY);
      const over = hitTestCard(w.x, w.y);
      if (over && over.id !== gesture.from) { createLink(gesture.from, over.id); cancelPending(); }
      else cancelPending();
    }
  }

cardsG.addEventListener('click', e => {

    else if (card.type === 'text') editText(card);
    else if (card.type === 'board') { /* у доски нет текста */ }
    else editTodoTitle(card);
    return;
  }
  if (e.target.closest('.todo-add')) { addItem(card, true); return; }
  const check = e.target.closest('.ti-check');
  if (check) {
    const row = check.closest('.ti');
    const item = card.items.find(i => i.id === row.dataset.item);
    if (item) { pushHistory(); item.done = !item.done; row.classList.toggle('done', item.done); updateTodoMeta(card); saveNow(); }

cardsG.addEventListener('focusout', e => {
  const t = e.target;
  if (!t.isContentEditable) return;
  const cardEl = t.closest('.card'); if (!cardEl) return;
  const card = getCard(cardEl.dataset.id); if (!card) return;
  if (t.classList.contains('note-content')) commitNote(card);
  else if (t.classList.contains('text-content')) commitText(card);
  else if (t.classList.contains('todo-title')) commitTodoTitle(card);
  else if (t.classList.contains('ti-text')) {
    const item = card.items.find(i => i.id === t.closest('.ti').dataset.item);

});
cardsG.addEventListener('keydown', e => {
  const t = e.target;
  if (!t.isContentEditable) return;
  if (e.key === 'Escape') { e.preventDefault(); t.blur(); return; }
  const cardEl = t.closest('.card');
  const card = cardEl && getCard(cardEl.dataset.id);
  if (!card) return;
  if (t.classList.contains('todo-title') && e.key === 'Enter') { e.preventDefault(); t.blur(); }
  if (t.classList.contains('ti-text') && e.key === 'Enter') {
    e.preventDefault();
    const pos = card.items.findIndex(i => i.id === t.closest('.ti').dataset.item);
    t.blur();
    if (pos >= 0) {
      pushHistory();
      const it = { id: uid(), text: '', done: false };
      card.items.splice(pos + 1, 0, it);
      renderTodoItems(card);
      saveNow();
      makeItemEditable(card, it);
    }
  }
  if (t.classList.contains('ti-text') && e.key === 'Backspace' && t.textContent === '' && card.items.length > 1) {
    e.preventDefault();
    const pos = card.items.findIndex(i => i.id === t.closest('.ti').dataset.item);
    removeItem(card, t.closest('.ti').dataset.item);
    const prev = card.items[Math.max(0, pos - 1)];
    if (prev) makeItemEditable(card, prev);
  }
});

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  const k = e.deltaMode === 1 ? 16 : 1;
  if (e.ctrlKey) {
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * k * 0.012));
  } else {
    ensureView();
    state.view.x -= e.deltaX * k;
    state.view.y -= e.deltaY * k;
    applyView(); scheduleSave();
  }
}, { passive: false });

const typing = () => {
  const ae = document.activeElement;
  return ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
};
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !typing()) { viewport.classList.add('spacepan'); e.preventDefault(); return; }
  if (e.key === 'Escape') {
    const ae = document.activeElement;
    if (ae && ae.isContentEditable) { ae.blur(); return; }
    if (!$('#scrim').hidden) { closeModal(); return; }
    closeMenu(); closeBoardPanel();
    if (ui.pendingConnect) cancelPending(); else deselect();
    return;
  }
  if (typing()) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    if (ui.sel && ui.sel.kind === 'card') duplicateCard(ui.sel.id);
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (!ui.sel) return;
    e.preventDefault();
    if (ui.sel.kind === 'card') deleteCard(ui.sel.id);
    else if (ui.sel.kind === 'link') deleteLink(ui.sel.id);
    else deleteStroke(ui.sel.id);
    return;
  }
  if (e.key === '=' || e.key === '+') { const r = viewport.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); }
  if (e.key === '-') { const r = viewport.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 0.8); }
  if (e.key === '0') { const r = viewport.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / state.view.s); }

function deleteBoard(id) {
  try { localStorage.removeItem(bkey(id)); } catch (e) {}
  idx = idx.filter(b => b.id !== id); saveIndex();

      switchBoard([...idx].sort((a, b) => (b.ts || 0) - (a.ts || 0))[0].id);

(function init() {
  try {
    const pp = JSON.parse(localStorage.getItem(PENKEY) || '{}');
    if (pp && typeof pp.color === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(pp.color)) ui.penColor = pp.color;
    if (pp && typeof pp.w === 'number') ui.penW = clamp(pp.w, 1, 40);
  } catch (e) {}

  try { idx = JSON.parse(localStorage.getItem(IDX) || '[]'); } catch (e) { idx = []; }
  if (!Array.isArray(idx)) idx = [];

  /* миграция со старой одиночной версии */
  if (!idx.length) {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (Array.isArray(d.cards)) {
          const clean = sanitizeData(d);
          if (clean.cards.length) {
            const id = uid();
            const name = (typeof d.name === 'string' && d.name) || 'Моя доска';
            idx = [{ id: id, name: name, ts: Date.now() }]; saveIndex();
            try { localStorage.setItem(bkey(id), JSON.stringify({ name: name, cards: clean.cards, links: clean.links, strokes: clean.strokes, view: d.view || null })); } catch (e) {}
          }
        }
        localStorage.removeItem(KEY);
      }
    } catch (e) {}
  }

  let act = null;
  try { act = localStorage.getItem(ACT); } catch (e) {}
  if (!idx.some(b => b.id === act)) act = idx.length ? idx[0].id : null;

  if (!act) {
    const b = makeSeedBoard();
    idx = [{ id: b.id, name: b.name, ts: Date.now() }]; saveIndex();
    try { localStorage.setItem(bkey(b.id), JSON.stringify(b.data)); } catch (e) {}
    boardId = b.id; setActive();
    state.name = b.name;
    state.cards = b.data.cards; state.links = b.data.links; state.strokes = b.data.strokes;
    state.view = { x: 0, y: 0, s: 1 };
    pendingFit = true; // после сборки подогнать вид под контент
    $('#boardName').value = state.name;
  } else {
    boardId = act; setActive();
    loadCurrent();
  }

  rebuildAll();
  updateEmptyHint();
  applyOrFit();
  resetHistory();
})();
</script>
</body>
</html>
